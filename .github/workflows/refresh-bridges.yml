name: Refresh bridge clearances (NBI -> Cloudflare)

# Self-updating bridge clearance data:
#  - Queries the USDOT National Bridge Inventory on ArcGIS Online (national,
#    all states, refreshed ~yearly by USDOT; reachable from cloud runners —
#    unlike the WAF-blocked FHWA bulk download and token-gated geo.dot.gov).
#  - Keeps low roadway UNDER-clearances (Item 54) on Interstate + US routes.
#  - Publishes the static bridges.json to Cloudflare Pages (free egress).
#
# Runs monthly (no-ops if the source hasn't changed) and on manual dispatch.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID  (15ecaba79ca09b6fb7c1a6acf9cdcdf4)

on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build bridges.json from ArcGIS Online NBI (all states)
        run: |
          node scripts/ingest_nbi_bridges.js --all-routes --prefixes=1,2 --out cloudflare-static/bridges.json
          node -e "const d=require('./cloudflare-static/bridges.json');if(!d.count)process.exit(1);console.log('bridges:',d.count)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy cloudflare-static --project-name=corridor-bridges --branch=main --commit-dirty=true
